name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Auto-Fix and Generate Gradle
        run: |
          # Agar aapka main folder hi repository hai, toh direct run hoga
          # Agar repository ke andar SDM naam ka folder hai, toh yeh command automatic wahan chali jayegi
          if [ -d "SDM" ]; then cd SDM; fi
          
          # SDK versions ko update karna taaki error na aaye
          find . -name "build.gradle*" -exec sed -i 's/compileSdk = [0-9]*/compileSdk = 34/g' {} +
          find . -name "build.gradle*" -exec sed -i 's/targetSdk = [0-9]*/targetSdk = 34/g' {} +
          
          # Missing gradlew file ko generate karein
          gradle wrapper --gradle-version 8.4

      - name: Build with Gradle
        run: |
          if [ -d "SDM" ]; then cd SDM; fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: "**/build/outputs/apk/debug/app-debug.apk"
