name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Auto-Fix AI Studio Mismatch & Missing Wrapper
        run: |
          # Agar main repository ke andar direct files hain ya SDM folder hai, dono handle karega
          if [ -d "SDM" ]; then cd SDM; fi
          
          # 1. AI Studio ki faulty compileSdk line ko standard number (34) se replace karein
          find . -name "build.gradle.kts" -exec sed -i 's/compileSdk = .*/compileSdk = 34/g' {} +
          find . -name "build.gradle.kts" -exec sed -i 's/targetSdk = .*/targetSdk = 34/g' {} +
          
          # 2. AI Studio ke custom keystore settings ko override karein taaki build debug config par chale
          find . -name "build.gradle.kts" -exec sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debugConfig")/g' {} +
          
          # 3. Missing gradlew command generator chalaein
          gradle wrapper --gradle-version 8.4

      - name: Build with Gradle
        run: |
          if [ -d "SDM" ]; then cd SDM; fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: sdm-smart-download-manager
          path: "**/build/outputs/apk/debug/app-debug.apk"
