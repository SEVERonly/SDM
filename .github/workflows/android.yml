name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Locate and Build Project
      run: |
        # Search for directory containing settings.gradle or build.gradle
        PROJECT_DIR=$(find . -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
        echo "Navigating to project directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # Execute Gradle build
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SDM-App-Debug
        path: '**/build/outputs/apk/debug/*.apk'
