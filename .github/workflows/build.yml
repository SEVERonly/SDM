name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Auto-Fix and Build Gradle Project
        run: |
          # Sahi directory 'SDM' ke andar enter karein
          cd SDM
          
          # 1. compileSdk aur targetSdk ko stable version (34) par force update karein
          find . -name "build.gradle.kts" -exec sed -i 's/compileSdk = .*/compileSdk = 34/g' {} +
          find . -name "build.gradle.kts" -exec sed -i 's/targetSdk = .*/targetSdk = 34/g' {} +
          
          # 2. Release signing ko hata kar debug keystore configuration lagayein
          find . -name "build.gradle.kts" -exec sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debugConfig")/g' {} +
          
          # 3. Wrapper build generator ko run karein aur compile karein
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Final APK File
        uses: actions/upload-artifact@v4
        with:
          name: sdm-smart-download-manager
          path: "**/build/outputs/apk/debug/app-debug.apk"
