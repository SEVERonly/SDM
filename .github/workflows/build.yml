name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Auto-Fix and Build Gradle Project
        run: |
          cd SDM
          
          # 1. Missing .env.example file ko automatic create karein (Bypass missing file error)
          touch .env.example
          touch app/.env.example
          
          # 2. compileSdk aur targetSdk ko stable version (34) par force update karein
          find . -name "build.gradle.kts" -exec sed -i 's/compileSdk = .*/compileSdk = 34/g' {} +
          find . -name "build.gradle.kts" -exec sed -i 's/targetSdk = .*/targetSdk = 34/g' {} +
          
          # 3. AI Studio ke custom release credentials ko poori tarah mita dein
          find . -name "build.gradle.kts" -exec sed -i '/signingConfig = signingConfigs.getByName("release")/d' {} +
          find . -name "build.gradle.kts" -exec sed -i '/signingConfig = .*/d' {} +
          
          # 4. Fresh gradle wrapper configure karke build chalayein
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Final APK File
        uses: actions/upload-artifact@v4
        with:
          name: sdm-smart-download-manager
          path: "**/build/outputs/apk/debug/app-debug.apk"
