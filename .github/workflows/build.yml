name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Auto-Fix AI Studio Mismatch
        run: |
          cd SDM
          # compileSdk aur targetSdk ko automatic fixed value (34) par badlein
          find . -name "build.gradle.kts" -exec sed -i 's/compileSdk = .*/compileSdk = 34/g' {} +
          find . -name "build.gradle.kts" -exec sed -i 's/targetSdk = .*/targetSdk = 34/g' {} +
          
          # Release signing ko hata kar debug keystore enable karein
          find . -name "build.gradle.kts" -exec sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debugConfig")/g' {} +
          
          # Wrapper generate karein
          gradle wrapper --gradle-version 8.4

      - name: Build with Gradle
        run: |
          cd SDM
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: sdm-smart-download-manager
          path: "SDM/app/build/outputs/apk/debug/app-debug.apk"
